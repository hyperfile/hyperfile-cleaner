[package]
name = "hyperfile-cleaner-staging"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.27"
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1.8.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.96.0"
btree-ondisk = { version = "0.14.0", path = "../btree-ondisk", default-features = false, features = ["rc", "tokio-runtime"] }
hyperfile = { version = "0.1.0", path = "../hyperfile-staging", default-features = false }
