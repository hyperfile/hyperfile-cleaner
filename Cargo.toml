[package]
name = "hyperfile-cleaner"
version = "0.10.2"
edition = "2024"
description = "Segments cleaner implementation for Hyperfile"
authors = ["Dai Yiyang"]
license = "Apache-2.0"
categories = ["asynchronous", "filesystem", "data-structures"]
keywords = ["file", "object-storage", "s3"]
homepage = "https://github.com/hyperfile/hyperfile-cleaner"
repository = "https://github.com/hyperfile/hyperfile-cleaner"

[dependencies]
log = "0.4.27"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
aws-config = { version = "1.8.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.96.0"
btree-ondisk = { version = "0.20.1", default-features = false, features = ["rc", "tokio-runtime"] }
hyperfile = { version = "0.10.3", default-features = false, features = ["blocking"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
